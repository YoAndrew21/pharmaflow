name: pharmaflow-compose

x-database-environment: &database-environment
  ASPNETCORE_ENVIRONMENT: Development
  ConnectionStrings__PharmaFlow: Host=postgres;Port=5432;Database=pharmaflow_compose;Username=pharmaflow_app
  Database__Password: ${PHARMAFLOW_DB_PASSWORD:?Set PHARMAFLOW_DB_PASSWORD in .env}

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: pharmaflow_bootstrap
      POSTGRES_DB: pharmaflow_compose
      POSTGRES_PASSWORD: ${PHARMAFLOW_BOOTSTRAP_PASSWORD:?Set PHARMAFLOW_BOOTSTRAP_PASSWORD in .env}
      PHARMAFLOW_APP_PASSWORD: ${PHARMAFLOW_DB_PASSWORD:?Set PHARMAFLOW_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-pharmaflow.sh:ro
    healthcheck:
      test:
        [
          CMD-SHELL,
          "pg_isready -h 127.0.0.1 -U pharmaflow_bootstrap -d pharmaflow_compose",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  db-init:
    build:
      context: .
      dockerfile: backend/PharmaFlow.Api/Dockerfile
      target: db-init
    environment: *database-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/PharmaFlow.Api/Dockerfile
      target: runtime
    environment:
      <<: *database-environment
      ASPNETCORE_HTTP_PORTS: "8080"
      Http__DisableHttpsRedirection: "true"
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          curl,
          --fail,
          --silent,
          --max-time,
          "3",
          http://127.0.0.1:8080/health/ready,
        ]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/workspace/frontend
      - ./demo-data:/workspace/demo-data:ro
      - frontend-modules:/workspace/frontend/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 12

volumes:
  postgres-data:
  frontend-modules:
